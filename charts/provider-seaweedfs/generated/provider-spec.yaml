                          format: int32
                          type: integer
                        volumeRead:
                          format: int32
                          type: integer
                        volumeWrite:
                          format: int32
                          type: integer
                      type: object
                    filerRead:
                      type: boolean
                    filerWrite:
                      type: boolean
                    volumeRead:
                      type: boolean
                    volumeWrite:
                      type: boolean
                  type: object
              type: object
            tls:
              description: |-
                TLS enables inter-component gRPC mTLS via the seaweedfs-operator.
                This does not terminate HTTPS on the S3 gateway — see README.
              properties:
                enabled:
                  description: Enabled turns on mTLS. Defaults to false.
                  type: boolean
                issuerRef:
                  description: |-
                    IssuerRef optionally references an existing cert-manager Issuer or
                    ClusterIssuer. When empty the operator provisions a self-signed CA.
                  properties:
                    group:
                      description: Group defaults to cert-manager.io in the operator when empty.
                      type: string
                    kind:
                      description: Kind is Issuer (namespaced) or ClusterIssuer. Empty defaults to Issuer.
                      type: string
                    name:
                      type: string
                  required:
                    - name
                  type: object
              type: object
            volumeServerDiskCount:
              format: int32
              minimum: 1
              type: integer
          type: object
