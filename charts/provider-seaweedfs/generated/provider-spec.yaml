          type: object
      type: seaweedfs
    s3:
      parametersSchema:
        openAPIV3Schema:
          properties:
            domainName:
              type: string
            https:
              description: |-
                HTTPS serves the S3 gateway over TLS (seaweedfs-operator httpsPort and
                tlsSecret). Nil, or enabled left unset, means HTTPS-only on port 8334.
                Set enabled to false for plain HTTP. An Ingress keeps the HTTP listener:
                the operator rejects HTTPS-only together with Ingress.
              properties:
                enabled:
                  description: Enabled defaults to true. Set false to serve plain HTTP on port.
                  type: boolean
                secretName:
                  description: |-
                    SecretName is an existing kubernetes.io/tls Secret (tls.crt and tls.key).
                    Empty means this provider creates Secret <instance>-s3-https.
                  type: string
                verifyTLS:
                  description: |-
                    VerifyTLS is the hint for clients of the in-cluster HTTPS endpoint.
                    Defaults to false for the provider-created certificate, and true when
                    secretName is set.
                  type: boolean
              type: object
            ingress:
              description: |-
                Ingress exposes the S3 gateway via a Kubernetes Ingress. With TLS,
                clients reach the API at https://<host>.
              properties:
                annotations:
                  additionalProperties:
                    type: string
                  description: Annotations applied to the Ingress (cert-manager issuer, nginx body size, …).
                  type: object
                className:
                  description: ClassName is the IngressClassName (e.g. nginx).
                  type: string
                enabled:
                  description: |-
                    Enabled turns on Ingress generation. Nil means "on when Host is set" so
                    the UI toggleable Ingress group can omit this field and only send nested
                    values. Explicit false disables Ingress even if Host is set.
                  type: boolean
                host:
                  description: |-
                    Host is the hostname the Ingress listens on. Required when Ingress is on;
                    a non-empty host also enables Ingress when Enabled is omitted.
                  type: string
                tls:
                  description: TLS terminates HTTPS at the Ingress controller.
                  properties:
                    secretName:
                      description: |-
                        SecretName is the kubernetes.io/tls Secret holding the certificate.
                        Create it by hand or via cert-manager (set an issuer annotation on the Ingress).
                      type: string
                    verifyTLS:
                      description: |-
                        VerifyTLS is the hint for clients using the HTTPS external endpoint.
                        Defaults to true when TLS is configured. Set false for self-signed certs.
                      type: boolean
                  required:
                    - secretName
                  type: object
              type: object
            port:
              description: |-
                Port is the S3 HTTP port. weed s3 listens for gRPC on port+10000, so
                the port is at most 55535.
              format: int32
              maximum: 55535
              minimum: 1
              type: integer
          type: object
      type: seaweedfs
    volume:
      parametersSchema:
        openAPIV3Schema:
          properties:
            maxVolumeCounts:
              description: |-
                MaxVolumeCounts caps volumes per disk. Unset lets SeaweedFS size it
