                      type: boolean
                  type: object
                victoriaMetrics:
                  description: VictoriaMetrics configures scraping by the VictoriaMetrics Operator.
                  properties:
                    enabled:
                      description: |-
                        Enabled creates the monitoring system's scrape resource for the
