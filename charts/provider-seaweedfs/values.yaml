# Default values for provider-seaweedfs.

# -- Number of replicas for the provider deployment
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/openeverest/provider-seaweedfs
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: "latest"

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Automount API credentials for the service account
  automountServiceAccountToken: true
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # -- Specifies whether RBAC resources should be created
  create: true

# -- Annotations to add to the deployment pods
podAnnotations: {}

# -- Labels to add to the deployment pods
podLabels: {}

podSecurityContext:
  # -- Run as non-root
  runAsNonRoot: true
  # -- Security context fsGroup
  fsGroup: 65534

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Drop all capabilities
  capabilities:
    drop:
      - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Run as user ID
  runAsUser: 65534

service:
  # -- Service type
  type: ClusterIP
  # -- Service port for the HTTP server (health endpoints)
  port: 8082

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

provider:
  # -- The name to register for the Provider custom resource
  name: provider-seaweedfs
  # -- Prefix of the ClusterInstancePresets the chart ships
  shortName: seaweedfs

openeverest:
  # -- Annotations to add to the objects of this chart that OpenEverest
  # interprets: the Provider, its BackupClass and the presets. A key under
  # openeverest.io/ belongs to the chart and to OpenEverest, and fails the
  # render.
  annotations: {}
    # For example, to have Argo CD apply these objects before the provider's
    # Deployment and the bundled operator:
    # argocd.argoproj.io/sync-wave: "-1"

# -- ClusterInstancePresets the chart ships, one per topology, with the UI
# defaults. Each is named <provider.shortName>-<name>; spec is an Instance spec
# without providerRef, which the chart sets. The version is left to the
# provider's default.
presets:
  - name: standalone
    enabled: true
    spec:
      topology:
        type: standalone
      components:
        master:
          replicas: 3
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
        volume:
          replicas: 2
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          storage:
            size: 10Gi
        filer:
          replicas: 2
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          storage:
            size: 1Gi
        s3:
          replicas: 1
          resources:
            limits:
              cpu: "1"
              memory: 512Mi

# -- Additional environment variables to set on the provider container
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# -- Additional volume mounts to add to the provider container
extraVolumeMounts: []

# -- Additional volumes to add to the pod
extraVolumes: []

admission:
  # -- PEM serving certificate for the Instance admission webhook. Left empty,
  # the chart generates one and keeps it across upgrades.
  certs:
    tls.crt: ""
    tls.key: ""
    ca.crt: ""
  certManager:
    # -- Issue the serving certificate with cert-manager, which must be installed.
    enabled: false

compatibility:
  acknowledge:
    # -- Install and start the provider even though the OpenEverest in the
    # cluster does not serve the OpenEverest this chart is built for. Otherwise
    # a Helm install fails before anything is applied, and a build applied
    # without that check (Argo CD, pre-rendered manifests) stays unready until
    # OpenEverest serves it. The chart writes it on the Provider, where the
    # provider reads it at startup. Set it to the version of OpenEverest the
    # cluster runs, which the error names. It holds on that release and the
    # later ones that keep its contract, such as its patch releases, and
    # expires with the first OpenEverest release that changes the contract,
    # which is checked again. Set ahead of an upgrade, it does nothing until
    # that release is installed.
    coreVersion: ""

# -- Leader election configuration
leaderElection:
  # -- Enable leader election (recommended for HA deployments)
  enabled: true

seaweedfs-operator:
  enabled: true
  fullnameOverride: seaweedfs-operator
  crds:
    create: true
  rbac:
    create: true
