name: provider-seaweedfs

components:
  master:
    type: seaweedfs
    parametersSchema: MasterCustomSpec
  volume:
    type: seaweedfs
    parametersSchema: VolumeCustomSpec
  filer:
    type: seaweedfs
    parametersSchema: FilerCustomSpec
  s3:
    type: seaweedfs
    parametersSchema: S3CustomSpec

# Instance-wide parameters (Instance.spec.parameters), a Go type in
# definition/types.go.
parametersSchema: Parameters

# Component types: the kind of the software each type runs, published as
# Provider.spec.componentTypes.<type>.kind and matched by monitoring classes.
# Version catalogs stay in versions.yaml.
componentTypes:
  seaweedfs:
    kind: seaweedfs
