# Standalone topology definition.
# This file defines both the structural topology and its UI rendering.
#
# config.components: Which components are used and their defaults.
# config.configSchema: Reference a Go type for custom topology config fields.
# ui: Rendering hints for the frontend form.
#
# See github.com/openeverest/provider-sdk/blob/main/PROVIDER_DEVELOPMENT.md
# for detailed guidance.

config:
    components:
        master:
            defaults:
                replicas: 3
        volume:
            defaults:
                replicas: 2
        filer:
            defaults:
                replicas: 1
        s3:
            defaults:
                replicas: 1
ui:
    sections:
        basicInfo:
            components:
                version:
                    fieldParams:
                        label: SeaweedFS Version
                        optionsPath: spec.versions
                        optionsPathConfig:
                            labelPath: name
                            valuePath: name
                        modes:
                            edit:
                                disabled: true
                            restore:
                                disabled: true
                    path: spec.version
                    uiType: select
                    validation:
                        required: true
            description: Provide the basic information for your new SeaweedFS instance.
            label: Basic Information
        master:
            components:
                replicas:
                    fieldParams:
                        defaultValue: 3
                        label: Master replicas
                    path: spec.components.master.replicas
                    uiType: number
                    validation:
                        int: true
                        max: 5
                        min: 1
                        required: true
                        celExpressions:
                          - celExpr: "spec.components.master.replicas % 2 == 1"
                            message: "The number of master replicas must be odd"
                volumeSizeLimitMB:
                    fieldParams:
                        defaultValue: 1024
                        label: Volume size limit (MB)
                    path: spec.components.master.parameters.masterVolumeSizeLimitMB
                    uiType: number
                    validation:
                        int: true
                        min: 1
                        required: false
                resources:
                    components:
                        cpu:
                            fieldParams:
                                defaultValue: 1
                                label: CPU
                                step: 1
                            path: spec.components.master.resources.limits.cpu
                            uiType: number
                            validation:
                                int: true
                                min: 1
                                required: true
                        memory:
                            fieldParams:
                                badge: Gi
                                badgeToApi: true
                                defaultValue: 0.5
                                label: Memory
                                step: 0.1
                            path: spec.components.master.resources.limits.memory
                            uiType: number
                            validation:
                                min: 0.25
                                required: true
                    componentsOrder:
                        - cpu
                        - memory
                    groupType: line
                    uiType: group
            componentsOrder:
                - replicas
                - volumeSizeLimitMB
                - resources
            description: Configure the SeaweedFS master servers that coordinate the cluster.
            label: Master
        volume:
            components:
                replicas:
                    fieldParams:
                        defaultValue: 2
                        label: Volume replicas
                    path: spec.components.volume.replicas
                    uiType: number
                    validation:
                        int: true
                        max: 10
                        min: 1
                        required: true
                diskCount:
                    fieldParams:
                        defaultValue: 1
                        label: Disks per volume server
                    path: spec.components.volume.parameters.volumeServerDiskCount
                    uiType: number
                    validation:
                        int: true
                        min: 1
                        required: false
                resources:
                    components:
                        cpu:
                            fieldParams:
                                defaultValue: 1
                                label: CPU
                                step: 1
                            path: spec.components.volume.resources.limits.cpu
                            uiType: number
                            validation:
                                int: true
                                min: 1
                                required: true
                        disk:
                            fieldParams:
                                badge: Gi
                                badgeToApi: true
                                defaultValue: 10
                                label: Disk
                            path: spec.components.volume.storage.size
                            uiType: number
                            validation:
                                int: true
                                max: 1000
                                min: 1
                                required: true
                        memory:
                            fieldParams:
                                badge: Gi
                                badgeToApi: true
                                defaultValue: 1
                                label: Memory
                                step: 0.1
                            path: spec.components.volume.resources.limits.memory
                            uiType: number
                            validation:
                                min: 0.25
                                required: true
                    componentsOrder:
                        - cpu
                        - memory
                        - disk
                    groupType: line
                    uiType: group
            componentsOrder:
                - replicas
                - diskCount
                - resources
            description: Configure the volume servers that store object data.
            label: Volume
        filer:
            components:
                replicas:
                    fieldParams:
                        defaultValue: 1
                        label: Filer replicas
                    path: spec.components.filer.replicas
                    uiType: number
                    validation:
                        int: true
                        max: 5
                        min: 1
                        required: true

                resources:
                    components:
                        cpu:
                            fieldParams:
                                defaultValue: 1
                                label: CPU
                                step: 1
                            path: spec.components.filer.resources.limits.cpu
                            uiType: number
                            validation:
                                int: true
                                min: 1
                                required: true
                        disk:
                            fieldParams:
                                badge: Gi
                                badgeToApi: true
                                defaultValue: 1
                                label: Disk
                            path: spec.components.filer.storage.size
                            uiType: number
                            validation:
                                int: true
                                max: 100
                                min: 1
                                required: true
                        memory:
                            fieldParams:
                                badge: Gi
                                badgeToApi: true
                                defaultValue: 0.5
                                label: Memory
                                step: 0.1
                            path: spec.components.filer.resources.limits.memory
                            uiType: number
                            validation:
                                min: 0.25
                                required: true
                    componentsOrder:
                        - cpu
                        - memory
                        - disk
                    groupType: line
                    uiType: group
            componentsOrder:
                - replicas
                - resources
            description: Configure the filer that provides the filesystem namespace and metadata store.
            label: Filer
        s3:
            components:
                replicas:
                    fieldParams:
                        defaultValue: 1
                        label: S3 replicas
                    path: spec.components.s3.replicas
                    uiType: number
                    validation:
                        int: true
                        max: 5
                        min: 1
                        required: true
                resources:
                    components:
                        cpu:
                            fieldParams:
                                defaultValue: 1
                                label: CPU
                                step: 1
                            path: spec.components.s3.resources.limits.cpu
                            uiType: number
                            validation:
                                int: true
                                min: 1
                                required: true
                        memory:
                            fieldParams:
                                badge: Gi
                                badgeToApi: true
                                defaultValue: 0.5
                                label: Memory
                                step: 0.1
                            path: spec.components.s3.resources.limits.memory
                            uiType: number
                            validation:
                                min: 0.25
                                required: true
                    componentsOrder:
                        - cpu
                        - memory
                    groupType: line
                    uiType: group
            componentsOrder:
                - replicas
                - resources
            description: Configure the S3-compatible gateway for object access.
            label: S3
    sectionsOrder:
        - basicInfo
        - master
        - volume
        - filer
        - s3
