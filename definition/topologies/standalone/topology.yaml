# Standalone topology definition.
# This file defines both the structural topology and its UI rendering.
#
# config.components: Which components are used and their defaults.
# config.configSchema: Reference a Go type for custom topology config fields.
# ui: Rendering hints for the frontend form.
#
# See github.com/openeverest/provider-sdk/blob/main/PROVIDER_DEVELOPMENT.md
# for detailed guidance.

config:
    parametersSchema: StandaloneTopologyConfig
    components:
        master:
            defaults:
                replicas: 3
        volume:
            defaults:
                replicas: 2
        filer:
            defaults:
                # Two filers keep S3 serving when one restarts or its node fails.
                replicas: 2
        s3:
            defaults:
                replicas: 1
ui:
    sections:
        basicInfo:
            components:
                version:
                    fieldParams:
                        label: SeaweedFS Version
                        optionsPath: spec.versions
                        optionsPathConfig:
                            labelPath: name
                            valuePath: name
                        modes:
                            edit:
                                disabled: true
                            restore:
                                disabled: true
                    path: spec.version
                    uiType: select
                    validation:
                        required: true
            description: Provide the basic information for your new SeaweedFS instance.
            label: Basic Information
        master:
            components:
                replicas:
                    fieldParams:
                        defaultValue: 3
                        label: Master replicas
                    path: spec.components.master.replicas
                    uiType: number
                    validation:
                        int: true
                        max: 5
                        min: 1
                        required: true
                        celExpressions:
                          - celExpr: "spec.components.master.replicas % 2 == 1"
                            message: "The number of master replicas must be odd"
                volumeSizeLimitMB:
                    fieldParams:
                        defaultValue: 1024
                        label: Volume size limit (MB)
                    path: spec.components.master.parameters.masterVolumeSizeLimitMB
                    uiType: number
                    validation:
                        int: true
                        min: 1
                        required: false
                volumeGrowthCount:
                    fieldParams:
                        defaultValue: 2
                        helperText: Logical volumes created at once when a bucket needs space. Each takes one slot per data copy on the volume servers. Higher values spread writes wider but use more slots per bucket.
                        label: Volume growth count
                    path: spec.components.master.parameters.volumeGrowthCount
                    uiType: number
                    validation:
                        int: true
                        min: 1
                        required: false
                replication:
                    fieldParams:
                        helperText: Three-digit SeaweedFS placement, for example 001. Empty uses 001 when volume replicas are at least 2, otherwise 000.
                        label: Replication
                    path: spec.topology.parameters.replication
                    uiType: text
                    validation:
                        required: false
                resources:
                    components:
                        cpu:
                            fieldParams:
                                unitLabel: CPU
                                defaultValue: 1
                                label: CPU
                            path: spec.components.master.resources.limits.cpu
                            uiType: quantity
                            validation:
                                int: true
                                min: 1
                                required: true
                        memory:
                            fieldParams:
                                unit: Gi
                                defaultValue: 0.5
                                label: Memory
                            path: spec.components.master.resources.limits.memory
                            uiType: quantity
                            validation:
                                min: 0.25
                                required: true
                        disk:
                            fieldParams:
                                unit: Gi
                                helperText: Optional. Enables master persistence when set at creation. Can be increased after creation when the storage class allows volume expansion. Cannot be enabled, shrunk, or cleared after creation.
                                label: Disk
                                modes:
                                    restore:
                                        disabled: true
                            path: spec.components.master.storage.size
                            uiType: quantity
                            validation:
                                int: true
                                max: 100
                                min: 1
                                required: false
                    componentsOrder:
                        - cpu
                        - memory
                        - disk
                    groupType: line
                    uiType: group
                storageClass:
                    dataSource:
                        provider: storageClasses
                    fieldParams:
                        helperText: Applies only when Disk is set.
                        label: Storage class
                        modes:
                            edit:
                                disabled: true
                            restore:
                                disabled: true
                    path: spec.components.master.storage.storageClass
                    uiType: select
                    validation:
                        required: false
            componentsOrder:
                - replicas
                - volumeSizeLimitMB
                - volumeGrowthCount
                - replication
                - resources
                - storageClass
            description: Configure the SeaweedFS master servers that coordinate the cluster.
            label: Master
        volume:
            components:
                replicas:
                    fieldParams:
                        defaultValue: 2
                        label: Volume replicas
                    path: spec.components.volume.replicas
                    uiType: number
                    validation:
                        int: true
                        max: 10
                        min: 1
                        required: true
                diskCount:
                    fieldParams:
                        defaultValue: 1
                        label: Disks per volume server
                    path: spec.topology.parameters.volumeServerDiskCount
                    uiType: number
                    validation:
                        int: true
                        min: 1
                        required: false
                maxVolumeCounts:
                    fieldParams:
                        helperText: Optional. Empty sizes it automatically from free disk space and the volume size limit, and follows disk expansion.
                        label: Max volumes per disk
                    path: spec.components.volume.parameters.maxVolumeCounts
                    uiType: number
                    validation:
                        int: true
                        min: 1
                        required: false
                resources:
                    components:
                        cpu:
                            fieldParams:
                                unitLabel: CPU
                                defaultValue: 1
                                label: CPU
                            path: spec.components.volume.resources.limits.cpu
                            uiType: quantity
                            validation:
                                int: true
                                min: 1
                                required: true
                        disk:
                            fieldParams:
                                unit: Gi
                                defaultValue: 10
                                helperText: Can be increased after creation when the storage class allows volume expansion. Cannot shrink.
                                label: Disk
                            path: spec.components.volume.storage.size
                            uiType: quantity
                            validation:
                                int: true
                                max: 1000
                                min: 1
                                required: true
                        memory:
                            fieldParams:
                                unit: Gi
                                defaultValue: 1
                                label: Memory
                            path: spec.components.volume.resources.limits.memory
                            uiType: quantity
                            validation:
                                min: 0.25
                                required: true
                    componentsOrder:
                        - cpu
                        - memory
                        - disk
                    groupType: line
                    uiType: group
                storageClass:
                    dataSource:
                        provider: storageClasses
                    fieldParams:
                        label: Storage class
                        modes:
                            edit:
                                disabled: true
                            restore:
                                disabled: true
                    path: spec.components.volume.storage.storageClass
                    uiType: select
                    validation:
                        required: true
            componentsOrder:
                - replicas
                - diskCount
                - maxVolumeCounts
                - resources
                - storageClass
            description: Configure the volume servers that store object data.
            label: Volume
        filer:
            components:
                replicas:
                    fieldParams:
                        defaultValue: 2
                        label: Filer replicas
                    path: spec.components.filer.replicas
                    uiType: number
                    validation:
                        int: true
                        max: 5
                        min: 1
                        required: true
                        celExpressions:
                          - celExpr: "!(spec.version == '4.47' && spec.components.filer.replicas > 1)"
                            message: "More than one filer requires SeaweedFS 4.48 or newer"
                maxMB:
                    fieldParams:
                        defaultValue: 4
                        label: Chunk size (MB)
                    path: spec.components.filer.parameters.maxMB
                    uiType: number
                    validation:
                        int: true
                        min: 1
                        required: false
                resources:
                    components:
                        cpu:
                            fieldParams:
                                unitLabel: CPU
                                defaultValue: 1
                                label: CPU
                            path: spec.components.filer.resources.limits.cpu
                            uiType: quantity
                            validation:
                                int: true
                                min: 1
                                required: true
                        disk:
                            fieldParams:
                                unit: Gi
                                defaultValue: 1
                                helperText: Can be increased after creation when the storage class allows volume expansion. Cannot shrink.
                                label: Disk
                            path: spec.components.filer.storage.size
                            uiType: quantity
                            validation:
                                int: true
                                max: 100
                                min: 1
                                required: true
                        memory:
                            fieldParams:
                                unit: Gi
                                defaultValue: 0.5
                                label: Memory
                            path: spec.components.filer.resources.limits.memory
                            uiType: quantity
                            validation:
                                min: 0.25
                                required: true
                    componentsOrder:
                        - cpu
                        - memory
                        - disk
                    groupType: line
                    uiType: group
                storageClass:
                    dataSource:
                        provider: storageClasses
                    fieldParams:
                        label: Storage class
                        modes:
                            edit:
                                disabled: true
                            restore:
                                disabled: true
                    path: spec.components.filer.storage.storageClass
                    uiType: select
                    validation:
                        required: true
            componentsOrder:
                - replicas
                - maxMB
                - resources
                - storageClass
            description: Configure the filer that provides the filesystem namespace and metadata store.
            label: Filer
        s3:
            components:
                replicas:
                    fieldParams:
                        defaultValue: 1
                        label: S3 replicas
                    path: spec.components.s3.replicas
                    uiType: number
                    validation:
                        int: true
                        max: 5
                        min: 1
                        required: true
                serviceType:
                    fieldParams:
                        defaultValue: ClusterIP
                        helperText: ClusterIP is in-cluster only. NodePort and LoadBalancer expose the service externally.
                        label: Service type
                        options:
                            - label: ClusterIP (internal)
                              value: ClusterIP
                            - label: NodePort
                              value: NodePort
                            - label: LoadBalancer
                              value: LoadBalancer
                    path: spec.components.s3.service.serviceType
                    uiType: select
                    validation:
                        required: false
                port:
                    fieldParams:
                        defaultValue: 8333
                        helperText: S3 HTTP port. Cannot be changed after creation without breaking existing clients and BackupStorage endpoints. Must not be 8334 (the HTTPS port) unless TLS is disabled.
                        label: HTTP port
                        modes:
                            edit:
                                disabled: true
                            restore:
                                disabled: true
                    path: spec.components.s3.parameters.port
                    uiType: number
                    validation:
                        int: true
                        max: 55535
                        min: 1
                        required: false
                        celExpressions:
                          - celExpr: "!has(spec.components.s3.parameters.port) || spec.components.s3.parameters.port != 8334 || (has(spec.parameters) && has(spec.parameters.tls) && has(spec.parameters.tls.mode) && spec.parameters.tls.mode == 'disabled')"
                            message: "S3 port cannot be 8334 while TLS is on"
                domainName:
                    fieldParams:
                        helperText: Comma-separated DNS hostnames for virtual-hosted-style buckets (for example s3.example.com).
                        label: Domain name
                    path: spec.components.s3.parameters.domainName
                    uiType: text
                    validation:
                        required: false
                ingress:
                    uiType: group
                    groupType: toggleable
                    label: Ingress
                    description: Expose S3 through a Kubernetes Ingress. With TLS, external clients get https://<host>.
                    components:
                        host:
                            fieldParams:
                                helperText: Public hostname for the S3 Ingress.
                                label: Host
                            path: spec.components.s3.parameters.ingress.host
                            uiType: text
                            validation:
                                required: true
                        className:
                            fieldParams:
                                helperText: IngressClass name (for example nginx).
                                label: Ingress class
                            path: spec.components.s3.parameters.ingress.className
                            uiType: text
                            validation:
                                required: false
                        tlsSecret:
                            fieldParams:
                                helperText: kubernetes.io/tls Secret name. Create it by hand or via a cert-manager annotation on the Ingress.
                                label: TLS secret
                            path: spec.components.s3.parameters.ingress.tls.secretName
                            uiType: text
                            validation:
                                required: false
                    componentsOrder:
                        - host
                        - className
                        - tlsSecret
                resources:
                    components:
                        cpu:
                            fieldParams:
                                defaultValue: 1
                                label: CPU
                                unitLabel: CPU
                            path: spec.components.s3.resources.limits.cpu
                            uiType: quantity
                            validation:
                                int: true
                                min: 1
                                required: true
                        memory:
                            fieldParams:
                                unit: Gi
                                defaultValue: 0.5
                                label: Memory
                            path: spec.components.s3.resources.limits.memory
                            uiType: quantity
                            validation:
                                min: 0.25
                                required: true
                    componentsOrder:
                        - cpu
                        - memory
                    groupType: line
                    uiType: group
            componentsOrder:
                - replicas
                - resources
                - serviceType
                - domainName
                - port
                - ingress
            description: Configure the S3-compatible gateway for object access.
            label: S3
        admin:
            components:
                enabled:
                    fieldParams:
                        defaultValue: false
                        helperText: Creates user admin and a generated password. One server on ClusterIP Service <instance>-admin, port 23646.
                        label: Enable admin UI
                    path: spec.topology.parameters.admin.enabled
                    uiType: toggle
                    validation:
                        required: false
            componentsOrder:
                - enabled
            description: Optional web UI for managing S3 buckets.
            label: Admin
        tls:
            components:
                mode:
                    fieldParams:
                        defaultValue: preferTLS
                        helperText: S3 over HTTPS on port 8334, with a certificate clients verify with ca.crt from the connection secret. Preferred also serves HTTP on the S3 port when an Ingress is on, because the Ingress connects over HTTP; Required serves HTTPS only and can't be used with an Ingress. Switching between Preferred and Required works anytime; Disabled (HTTP only) can only be chosen when the instance is created.
                        label: S3 TLS mode
                        options:
                            - label: Disabled
                              value: disabled
                            - label: "Preferred: HTTPS, and HTTP for the Ingress"
                              value: preferTLS
                            - label: "Required: HTTPS only"
                              value: requireTLS
                    path: spec.parameters.tls.mode
                    uiType: select
                    validation:
                        required: false
                        celExpressions:
                          - celExpr: "!has(spec.parameters) || !has(spec.parameters.tls) || !has(spec.parameters.tls.mode) || spec.parameters.tls.mode != 'requireTLS' || !has(spec.components.s3.parameters) || !has(spec.components.s3.parameters.ingress) || !has(spec.components.s3.parameters.ingress.host) || spec.components.s3.parameters.ingress.host == '' || (has(spec.components.s3.parameters.ingress.enabled) && !spec.components.s3.parameters.ingress.enabled)"
                            message: "Required can't be used with an S3 Ingress: choose Preferred"
                certificateSecretName:
                    fieldParams:
                        helperText: A kubernetes.io/tls Secret in this namespace (tls.crt, tls.key and, for clients, ca.crt) the S3 gateway serves instead of a certificate signed for this instance. Its names must include <instance>-s3.<namespace>.svc. You renew it. Can only be chosen when TLS is turned on.
                        label: S3 certificate secret (optional)
                        modes:
                            edit:
                                disabled: true
                    path: spec.parameters.tls.certificateSecretName
                    uiType: text
                    validation:
                        required: false
                        regex:
                            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                            message: "Must be a valid Kubernetes object name (lowercase letters, digits, '-' and '.')"
                        celExpressions:
                          - celExpr: "!has(spec.parameters) || !has(spec.parameters.tls) || !has(spec.parameters.tls.certificateSecretName) || spec.parameters.tls.certificateSecretName == '' || !has(spec.parameters.tls.mode) || spec.parameters.tls.mode != 'disabled'"
                            message: "Turn TLS on to use a certificate secret"
                internalTLS:
                    fieldParams:
                        defaultValue: false
                        helperText: Mutual TLS on gRPC between master, volume, filer and S3, with certificates seaweedfs-operator requests from cert-manager. Requires cert-manager. Works with any S3 TLS mode. Can only be chosen when the instance is created.
                        label: Inter-component TLS
                        modes:
                            edit:
                                disabled: true
                            restore:
                                disabled: true
                    path: spec.parameters.tls.internalTLS
                    uiType: toggle
                    validation:
                        required: false
                issuer:
                    uiType: group
                    groupType: bordered
                    label: Bring your own CA (optional)
                    description: A cert-manager issuer that signs the S3 certificate (unless a certificate secret is set) and the inter-component certificates, instead of a CA created for this instance. For clients to get ca.crt it must put its CA into the certificate secrets, as CA and Vault issuers do. Can only be chosen when the instance is created.
                    components:
                        issuerName:
                            fieldParams:
                                helperText: An Issuer in this namespace or a ClusterIssuer. Leave empty for a CA created for this instance.
                                label: cert-manager issuer
                                modes:
                                    edit:
                                        disabled: true
                            path: spec.parameters.tls.issuer.name
                            uiType: text
                            validation:
                                required: false
                                regex:
                                    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                                    message: "Must be a valid Kubernetes object name (lowercase letters, digits, '-' and '.')"
                                celExpressions:
                                  - celExpr: "!has(spec.parameters) || !has(spec.parameters.tls) || !has(spec.parameters.tls.issuer) || !has(spec.parameters.tls.issuer.name) || spec.parameters.tls.issuer.name == '' || (has(spec.parameters.tls.internalTLS) && spec.parameters.tls.internalTLS) || ((!has(spec.parameters.tls.mode) || spec.parameters.tls.mode != 'disabled') && (!has(spec.parameters.tls.certificateSecretName) || spec.parameters.tls.certificateSecretName == ''))"
                                    message: "The issuer would sign nothing: turn on inter-component TLS, or S3 TLS without a certificate secret"
                                  - celExpr: "!has(spec.parameters) || !has(spec.parameters.tls) || !has(spec.parameters.tls.issuer) || !has(spec.parameters.tls.issuer.kind) || spec.parameters.tls.issuer.kind == '' || (has(spec.parameters.tls.issuer.name) && spec.parameters.tls.issuer.name != '')"
                                    message: "Name the issuer"
                        issuerKind:
                            fieldParams:
                                helperText: Issuer when not set
                                label: Issuer kind
                                modes:
                                    edit:
                                        disabled: true
                                options:
                                    - label: Issuer
                                      value: Issuer
                                    - label: ClusterIssuer
                                      value: ClusterIssuer
                            path: spec.parameters.tls.issuer.kind
                            uiType: select
                            validation:
                                required: false
                    componentsOrder:
                        - issuerName
                        - issuerKind
            componentsOrder:
                - mode
                - certificateSecretName
                - internalTLS
                - issuer
            description: Encrypt S3 traffic with HTTPS and, optionally, gRPC between the SeaweedFS components. Extra DNS names for the S3 certificate (spec.parameters.tls.additionalNames) are set in YAML.
            label: TLS
    sectionsOrder:
        - basicInfo
        - master
        - volume
        - filer
        - s3
        - admin
        - tls
