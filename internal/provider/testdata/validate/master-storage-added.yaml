# The minimal Instance with master storage; invalid as an update of minimal.yaml.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: example
spec:
  providerRef:
    name: provider-seaweedfs
  topology:
    type: standalone
  components:
    master:
      replicas: 1
      storage:
        size: 1Gi
    volume:
      replicas: 1
      storage:
        size: 10Gi
    filer:
      replicas: 1
      storage:
        size: 1Gi
    s3:
      replicas: 1
