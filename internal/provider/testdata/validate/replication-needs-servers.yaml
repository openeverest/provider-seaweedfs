# Replication 001 keeps two copies, which needs two volume servers.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: example
spec:
  providerRef:
    name: provider-seaweedfs
  topology:
    type: standalone
    parameters:
      replication: "001"
  components:
    master:
      replicas: 1
    volume:
      replicas: 1
      storage:
        size: 10Gi
    filer:
      replicas: 1
      storage:
        size: 1Gi
    s3:
      replicas: 1
