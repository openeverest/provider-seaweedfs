# weed s3 listens for gRPC on port+10000, so the S3 port is at most 55535.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: example
spec:
  providerRef:
    name: provider-seaweedfs
  topology:
    type: standalone
  components:
    master:
      replicas: 1
    volume:
      replicas: 1
      storage:
        size: 10Gi
    filer:
      replicas: 1
      storage:
        size: 1Gi
    s3:
      replicas: 1
      parameters:
        port: 55536
