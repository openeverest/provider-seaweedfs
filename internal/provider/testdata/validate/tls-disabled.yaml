# TLS off: plain HTTP S3.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: example
spec:
  providerRef:
    name: provider-seaweedfs
  parameters:
    tls:
      mode: disabled
  topology:
    type: standalone
  components:
    master:
      replicas: 1
    volume:
      replicas: 1
      storage:
        size: 10Gi
    filer:
      replicas: 1
      storage:
        size: 1Gi
    s3:
      replicas: 1
