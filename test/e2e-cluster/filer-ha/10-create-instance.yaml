apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: e2e-filer-ha
spec:
  providerRef:
    name: provider-seaweedfs
  topology:
    type: standalone
  components:
    master:
      type: seaweedfs
      replicas: 1
    volume:
      type: seaweedfs
      replicas: 2
      parameters:
        maxVolumeCounts: 32
      storage:
        size: 1Gi
    filer:
      type: seaweedfs
      replicas: 2
      storage:
        size: 1Gi
    s3:
      type: seaweedfs
      replicas: 1
