apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: e2e-metrics
status:
  phase: Ready
  # One endpoint per Instance component, for monitoring extensions to scrape.
  monitoring:
    sources:
      metrics:
        - component: master
          kind: seaweedfs
          port: master-metrics
        - component: volume
          kind: seaweedfs
          port: volume-metrics
        - component: filer
          kind: seaweedfs
          port: filer-metrics
        - component: s3
          kind: seaweedfs
          port: s3-metrics
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: e2e-metrics
spec:
  serviceMonitor:
    enabled: false
  master:
    metricsPort: 9327
  volume:
    metricsPort: 9327
  filer:
    metricsPort: 9327
  s3:
    metricsPort: 9327
