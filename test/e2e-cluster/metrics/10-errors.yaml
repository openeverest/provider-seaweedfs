# The operator creates no ServiceMonitors: a monitoring extension scrapes the
# published endpoints, and both would scrape every pod twice.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: e2e-metrics-master
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: e2e-metrics-volume
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: e2e-metrics-filer
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: e2e-metrics-s3
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: e2e-metrics-admin
