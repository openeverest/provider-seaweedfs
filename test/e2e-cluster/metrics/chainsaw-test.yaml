---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: metrics
spec:
  description: |
    The monitoring contract on a real seaweedfs-operator with the Prometheus
    Operator CRDs installed: every component serves metrics on its named
    port, the provider publishes one endpoint per component in
    status.monitoring.sources, and the operator creates no ServiceMonitors.
  # Installing the CRD restarts the operator, which caches whether the
  # ServiceMonitor CRD exists. Run alone so other tests do not see it restart.
  concurrent: false
  catch:
    - script:
        content: |
          set +e
          echo '--- test namespace ---'
          kubectl -n "$NAMESPACE" get instance,sts,deploy,pod,svc -o yaml
          echo '--- seaweed ---'
          kubectl -n "$NAMESPACE" get seaweed -o yaml
          echo '--- scrapes ---'
          kubectl -n "$NAMESPACE" get servicemonitor -o yaml
          echo '--- provider-system ---'
          kubectl -n provider-system get deploy,pod -o wide
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-seaweedfs
        tail: 100
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=seaweedfs-operator
        tail: 100
  steps:
    - name: provider-operator-installed
      timeouts:
        assert: 30s
      try:
        - assert:
            file: 00-assert.yaml

    # With the ServiceMonitor CRD the operator would create ServiceMonitors
    # for every metrics port unless the provider turns them off. A CRD the
    # cluster already has is left alone. The seaweedfs-operator probes for
    # the CRD once and caches the answer, so it is restarted to pick it up.
    - name: install-servicemonitor-crd
      try:
        - script:
            timeout: 5m
            content: |
              set -e
              kubectl get crd servicemonitors.monitoring.coreos.com >/dev/null 2>&1 || \
                kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.93.1/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml
              kubectl wait --for=condition=Established --timeout=60s crd/servicemonitors.monitoring.coreos.com
              kubectl -n provider-system rollout restart deployment/seaweedfs-operator
              kubectl -n provider-system rollout status deployment/seaweedfs-operator --timeout=3m

    - name: publish-sources
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            file: 10-assert.yaml
        - error:
            file: 10-errors.yaml

    # Every published endpoint is served: the component's pod names the port
    # and serves metrics on it. The API server's pod proxy reaches the pods
    # without a client pod.
    - name: components-serve-metrics
      try:
        - script:
            timeout: 2m
            content: |
              set -e
              for component in master volume filer s3; do
                pod=$(kubectl -n "$NAMESPACE" get pod \
                  -l core.openeverest.io/instance=e2e-metrics,core.openeverest.io/component=$component \
                  -o jsonpath='{.items[0].metadata.name}')
                port=$(kubectl -n "$NAMESPACE" get pod "$pod" \
                  -o jsonpath="{.spec.containers[*].ports[?(@.name=='$component-metrics')].containerPort}")
                test "$port" = 9327 || { echo "$pod: no $component-metrics port 9327 (got '$port')"; exit 1; }
                series=$(kubectl get --raw "/api/v1/namespaces/$NAMESPACE/pods/$pod:9327/proxy/metrics" | grep -c '^# TYPE ')
                test "$series" -gt 0 || { echo "$pod: no metrics on :9327/metrics"; exit 1; }
                echo "$component: $pod serves $series metric families"
              done

    - name: delete-instance
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: e2e-metrics
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: e2e-metrics
            timeout: 10m
            for:
              deletion: {}
        - wait:
            apiVersion: seaweed.seaweedfs.com/v1
            kind: Seaweed
            name: e2e-metrics
            timeout: 10m
            for:
              deletion: {}
