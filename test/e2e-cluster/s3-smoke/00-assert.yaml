# The suite drives a real operator. Fail here instead of waiting out the
# Ready timeout when deploy-provider-e2e was not applied to this cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-seaweedfs
  namespace: provider-system
status:
  availableReplicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-operator
  namespace: provider-system
status:
  availableReplicas: 1
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: seaweeds.seaweed.seaweedfs.com
---
apiVersion: core.openeverest.io/v1alpha1
kind: Provider
metadata:
  name: provider-seaweedfs
