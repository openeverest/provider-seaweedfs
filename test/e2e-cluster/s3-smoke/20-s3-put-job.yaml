apiVersion: batch/v1
kind: Job
metadata:
  name: s3-put
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: aws
          image: amazon/aws-cli:2.38.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p "$HOME/.aws"
              cat > "$HOME/.aws/config" <<'EOF'
              [default]
              s3 =
                  addressing_style = path
              EOF
              printf '%s' 'e2e-smoke' > /tmp/payload
              # The default gateway certificate is self-signed (verifyTLS=false).
              tls_flag=
              if [ "$VERIFY_TLS" = "false" ]; then
                tls_flag=--no-verify-ssl
              fi
              aws $tls_flag s3 mb s3://e2e-smoke --endpoint-url "$ENDPOINT"
              aws $tls_flag s3 cp /tmp/payload s3://e2e-smoke/obj --endpoint-url "$ENDPOINT"
              aws $tls_flag s3 cp s3://e2e-smoke/obj /tmp/downloaded --endpoint-url "$ENDPOINT"
              expected=$(sha256sum /tmp/payload | awk '{print $1}')
              actual=$(sha256sum /tmp/downloaded | awk '{print $1}')
              test "$expected" = "$actual"
              # The gateway must reject unsigned requests.
              if aws $tls_flag s3 cp s3://e2e-smoke/obj /tmp/anon --endpoint-url "$ENDPOINT" --no-sign-request; then
                echo "anonymous read was allowed" >&2
                exit 1
              fi
              if aws $tls_flag s3 cp /tmp/payload s3://e2e-smoke/anon --endpoint-url "$ENDPOINT" --no-sign-request; then
                echo "anonymous write was allowed" >&2
                exit 1
              fi
          env:
            - name: HOME
              value: /tmp
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: e2e-seaweedfs-conn
                  key: region
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: e2e-seaweedfs-conn
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: e2e-seaweedfs-conn
                  key: AWS_SECRET_ACCESS_KEY
            - name: ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: e2e-seaweedfs-conn
                  key: endpointURL
            - name: VERIFY_TLS
              valueFrom:
                secretKeyRef:
                  name: e2e-seaweedfs-conn
                  key: verifyTLS
