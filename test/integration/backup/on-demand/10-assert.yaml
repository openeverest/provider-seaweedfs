apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: backup-seaweedfs
status:
  (conditions[?type == 'BackupConfigured'] | [0].status): "True"
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: backup-seaweedfs
  (ownerReferences[?kind == 'Instance' && name == 'backup-seaweedfs'] | length(@)): 1
spec:
  backup:
    storages:
      test-s3:
        type: s3
        s3:
          bucket: test-backup-bucket
          region: us-east-1
          endpoint: https://s3.example.com
          # The Instance's own path: backups/<namespace>/<instance>/<uid>/<storage>.
          (starts_with(directory, join('', ['/backups/', $namespace, '/backup-seaweedfs/']))): true
          (ends_with(directory, '/test-s3')): true
          forcePathStyle: true
        credentialsSecret: test-s3-creds
    dataMirror:
      - storageName: test-s3
        filerPath: /
