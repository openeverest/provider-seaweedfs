apiVersion: v1
kind: Secret
metadata:
  name: test-s3-creds
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: test-access-key
  AWS_SECRET_ACCESS_KEY: test-secret-key
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: test-s3
spec:
  backupStorageClassRef:
    name: s3
  location:
    objectStore:
      bucket: test-backup-bucket
  parameters:
    region: us-east-1
    endpointURL: https://s3.example.com
    forcePathStyle: true
  authentication:
    mode: AccessKey
    credentialsSecretRef:
      name: test-s3-creds
