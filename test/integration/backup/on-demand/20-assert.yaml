apiVersion: backup.openeverest.io/v1alpha1
kind: Backup
metadata:
  name: adhoc-1
status:
  state: Pending
  executionMode: ProviderManaged
  operatorBackupRef:
    group: seaweed.seaweedfs.com
    kind: SeaweedBackup
    name: adhoc-1
---
apiVersion: seaweed.seaweedfs.com/v1
kind: SeaweedBackup
metadata:
  name: adhoc-1
  (ownerReferences[?kind == 'Backup' && name == 'adhoc-1'] | length(@)): 1
spec:
  clusterName: backup-seaweedfs
  storageName: test-s3
  filerPath: /
