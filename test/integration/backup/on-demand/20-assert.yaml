apiVersion: backup.openeverest.io/v1alpha1
kind: Backup
metadata:
  name: adhoc-1
status:
  state: Pending
  executionMode: ProviderManaged
  operatorBackupRef:
    group: seaweed.seaweedfs.com
    kind: SeaweedBackup
    # UID-derived: <backup-name>-<uid[:8]>
    (starts_with(name, 'adhoc-1-')): true
    (length(name) == length('adhoc-1-') + 8): true
