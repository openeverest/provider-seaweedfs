apiVersion: backup.openeverest.io/v1alpha1
kind: Backup
metadata:
  name: adhoc-filerpath
status:
  state: Pending
  operatorBackupRef:
    group: seaweed.seaweedfs.com
    kind: SeaweedBackup
    name: adhoc-filerpath
---
apiVersion: seaweed.seaweedfs.com/v1
kind: SeaweedBackup
metadata:
  name: adhoc-filerpath
  (ownerReferences[?kind == 'Backup' && name == 'adhoc-filerpath'] | length(@)): 1
spec:
  clusterName: backup-seaweedfs
  storageName: test-s3
  filerPath: /buckets
