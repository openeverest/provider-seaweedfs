apiVersion: backup.openeverest.io/v1alpha1
kind: Backup
metadata:
  name: adhoc-filerpath
status:
  state: Pending
  operatorBackupRef:
    group: seaweed.seaweedfs.com
    kind: SeaweedBackup
    (starts_with(name, 'adhoc-filerpath-')): true
    (length(name) == length('adhoc-filerpath-') + 8): true
