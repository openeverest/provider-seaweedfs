apiVersion: backup.openeverest.io/v1alpha1
kind: Backup
metadata:
  name: adhoc-filerpath
spec:
  origin:
    type: Instance
    instanceRef:
      name: backup-seaweedfs
  classRef:
    name: seaweedfs-filer-meta
  storageRef:
    name: test-s3
  deletionPolicy: Retain
  parameters:
    filerPath: /buckets
