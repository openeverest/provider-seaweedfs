---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: backup-on-demand
spec:
  description: |
    On-demand filer-metadata backup lifecycle: register an S3 BackupStorage on
    the Instance, create a Backup, map SeaweedBackup status through
    Pending → Running → Succeeded, honour filerPath parameters, map Failed,
    delete the SeaweedBackup when the Backup CR is removed, and confirm a
    deletionPolicy Delete Backup fails at create then deletes without sticking.
    SeaweedBackup names are UID-derived so Retain recreates do not overwrite
    the previous filer catalog path.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,seaweed,backup,backupstorage,seaweedbackup,secret -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-seaweedfs
        tail: 100
  steps:
    - name: provider-operator-installed
      try:
        - assert:
            file: 00-assert.yaml

    - name: enable-backup-on-instance
      try:
        - apply:
            file: 10-setup.yaml
        - apply:
            file: 10-create-cluster.yaml
        - assert:
            file: 10-assert.yaml

    - name: create-on-demand-backup
      try:
        - apply:
            file: 20-create-backup.yaml
        - assert:
            file: 20-assert.yaml
        - script:
            content: |
              SB=$(kubectl get backup/adhoc-1 -n "$NAMESPACE" -o jsonpath='{.status.operatorBackupRef.name}')
              test -n "$SB"
              test "$SB" != "adhoc-1"
              test "$(kubectl get seaweedbackup/"$SB" -n "$NAMESPACE" -o jsonpath='{.spec.clusterName}')" = "backup-seaweedfs"
              test "$(kubectl get seaweedbackup/"$SB" -n "$NAMESPACE" -o jsonpath='{.spec.storageName}')" = "test-s3"
              test "$(kubectl get seaweedbackup/"$SB" -n "$NAMESPACE" -o jsonpath='{.spec.filerPath}')" = "/"
              test "$(kubectl get seaweedbackup/"$SB" -n "$NAMESPACE" -o jsonpath='{.metadata.ownerReferences[0].name}')" = "adhoc-1"

    # The seaweedfs-operator is scaled to 0, so the tests stand in for it by
    # patching SeaweedBackup status.
    - name: backup-running
      try:
        - script:
            content: |
              SB=$(kubectl get backup/adhoc-1 -n "$NAMESPACE" -o jsonpath='{.status.operatorBackupRef.name}')
              kubectl patch seaweedbackup/"$SB" --subresource status -n "$NAMESPACE" --type=merge \
                -p '{"status":{"phase":"Running","startTime":"2026-01-01T00:00:00Z"}}'
        - assert:
            file: 21-assert.yaml

    - name: backup-succeeded
      try:
        - script:
            content: |
              SB=$(kubectl get backup/adhoc-1 -n "$NAMESPACE" -o jsonpath='{.status.operatorBackupRef.name}')
              kubectl patch seaweedbackup/"$SB" --subresource status -n "$NAMESPACE" --type=merge \
                -p '{"status":{"phase":"Completed","startTime":"2026-01-01T00:00:00Z","completionTime":"2026-01-01T00:01:00Z"}}'
        - assert:
            file: 22-assert.yaml

    - name: create-backup-with-filer-path
      try:
        - apply:
            file: 30-create-backup-filerpath.yaml
        - assert:
            file: 30-assert.yaml
        - script:
            content: |
              SB=$(kubectl get backup/adhoc-filerpath -n "$NAMESPACE" -o jsonpath='{.status.operatorBackupRef.name}')
              test -n "$SB"
              test "$(kubectl get seaweedbackup/"$SB" -n "$NAMESPACE" -o jsonpath='{.spec.filerPath}')" = "/buckets"
              test "$(kubectl get seaweedbackup/"$SB" -n "$NAMESPACE" -o jsonpath='{.metadata.ownerReferences[0].name}')" = "adhoc-filerpath"

    - name: backup-failed
      try:
        - script:
            content: |
              SB=$(kubectl get backup/adhoc-filerpath -n "$NAMESPACE" -o jsonpath='{.status.operatorBackupRef.name}')
              kubectl patch seaweedbackup/"$SB" --subresource status -n "$NAMESPACE" --type=merge \
                -p '{"status":{"phase":"Failed","conditions":[{"type":"Complete","status":"False","reason":"JobFailed","message":"snapshot job failed","lastTransitionTime":"2026-01-01T00:02:00Z"}]}}'
        - assert:
            file: 31-assert.yaml

    - name: delete-backup-cleans-seaweedbackup
      try:
        - script:
            content: |
              SB=$(kubectl get backup/adhoc-1 -n "$NAMESPACE" -o jsonpath='{.status.operatorBackupRef.name}')
              test -n "$SB"
              kubectl delete backup/adhoc-1 -n "$NAMESPACE"
              kubectl wait --for=delete backup/adhoc-1 -n "$NAMESPACE" --timeout=60s
              kubectl wait --for=delete "seaweedbackup/$SB" -n "$NAMESPACE" --timeout=60s

    # Delete-policy Backups fail at create (no SeaweedBackup). Cleanup must
    # still remove the finalizer so deletion is not stuck forever.
    - name: delete-policy-backup-fails-and-deletes
      try:
        - apply:
            file: 40-create-backup-delete-policy.yaml
        - assert:
            file: 40-assert.yaml
        - delete:
            ref:
              apiVersion: backup.openeverest.io/v1alpha1
              kind: Backup
              name: adhoc-delete-policy
        - wait:
            apiVersion: backup.openeverest.io/v1alpha1
            kind: Backup
            name: adhoc-delete-policy
            for:
              deletion: {}

    - name: delete-cluster
      try:
        - script:
            content: |
              SB=$(kubectl get backup/adhoc-filerpath -n "$NAMESPACE" -o jsonpath='{.status.operatorBackupRef.name}')
              test -n "$SB"
              kubectl delete instance/backup-seaweedfs -n "$NAMESPACE"
              kubectl wait --for=delete seaweed/backup-seaweedfs -n "$NAMESPACE" --timeout=120s
              kubectl wait --for=delete "seaweedbackup/$SB" -n "$NAMESPACE" --timeout=120s
