apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: restore-seaweedfs
status:
  (conditions[?type == 'BackupConfigured'] | [0].status): "True"
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: restore-seaweedfs
  (ownerReferences[?kind == 'Instance' && name == 'restore-seaweedfs'] | length(@)): 1
spec:
  backup:
    storages:
      test-s3:
        type: s3
        s3:
          bucket: test-backup-bucket
          region: us-east-1
          endpoint: https://s3.example.com
          directory: /
          forcePathStyle: true
        credentialsSecret: test-s3-creds
    dataMirror:
      - storageName: test-s3
        filerPath: /
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restore-seaweedfs-filer
status:
  readyReplicas: 1
