apiVersion: v1
kind: Secret
metadata:
  name: test-s3-creds
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: test-access-key
  AWS_SECRET_ACCESS_KEY: test-secret-key
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupStorage
metadata:
  name: test-s3
spec:
  type: s3
  s3:
    bucket: test-backup-bucket
    region: us-east-1
    endpointURL: https://s3.example.com
    forcePathStyle: true
    credentialsSecretRef:
      name: test-s3-creds
---
# SyncRestore probes http://<cluster>-filer.<ns>:8888 before creating a
# SeaweedRestore. The real operator is scaled to 0, so this stand-in answers
# the tiny directory list (limit=1/2) the emptiness gate uses.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-filer-script
data:
  server.py: |
    #!/usr/bin/env python3
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    import json
    import threading

    mode_lock = threading.Lock()
    mode = "empty"  # empty | nonempty

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            return

        def _read_body(self):
            n = int(self.headers.get("Content-Length", "0"))
            return self.rfile.read(n).decode("utf-8") if n else ""

        def do_PUT(self):
            global mode
            if self.path.rstrip("/") != "/__test/mode":
                self.send_error(404)
                return
            body = self._read_body().strip()
            if body not in ("empty", "nonempty"):
                self.send_error(400, "mode must be empty or nonempty")
                return
            with mode_lock:
                mode = body
            self.send_response(204)
            self.end_headers()

        def do_GET(self):
            if self.headers.get("Accept") != "application/json":
                self.send_error(400, "Accept application/json required")
                return
            with mode_lock:
                current = mode
            if current == "nonempty":
                entries = [
                    {"FullPath": "/.seaweedfs-operator"},
                    {"FullPath": "/buckets"},
                ]
            else:
                entries = [{"FullPath": "/.seaweedfs-operator"}]
            body = json.dumps({
                "Entries": entries,
                "EmptyFolder": len(entries) == 0,
            }).encode("utf-8")
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    ThreadingHTTPServer(("0.0.0.0", 8888), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restore-seaweedfs-filer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restore-seaweedfs-filer
  template:
    metadata:
      labels:
        app: restore-seaweedfs-filer
    spec:
      containers:
        - name: fake-filer
          image: python:3.12-alpine
          command: ["python3", "/script/server.py"]
          ports:
            - name: http
              containerPort: 8888
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 1
            periodSeconds: 1
      volumes:
        - name: script
          configMap:
            name: fake-filer-script
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: restore-seaweedfs-filer
spec:
  selector:
    app: restore-seaweedfs-filer
  ports:
    - name: http
      port: 8888
      targetPort: 8888
