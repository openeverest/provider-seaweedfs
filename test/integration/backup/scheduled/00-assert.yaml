apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-seaweedfs
  namespace: provider-system
status:
  availableReplicas: 1
---
# Scaled to 0 so the tests drive SeaweedBackup create/status by hand
# (no real cron scheduler).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-operator
  namespace: provider-system
spec:
  replicas: 0
---
apiVersion: core.openeverest.io/v1alpha1
kind: Provider
metadata:
  name: provider-seaweedfs
---
apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: seaweedfs-filer-meta
spec:
  executionMode: ProviderManaged
  supportedProviders:
    - provider-seaweedfs
  providerManaged:
    supportsPITR: false
