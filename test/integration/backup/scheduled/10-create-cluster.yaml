apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: backup-seaweedfs
spec:
  providerRef:
    name: provider-seaweedfs
  topology:
    type: standalone
  backup:
    enabled: true
    classRef:
      name: seaweedfs-filer-meta
    storages:
      - storageRef:
          name: test-s3
        schedules:
          - name: nightly
            enabled: true
            cron: "0 2 * * *"
            retention:
              type: count
              count: 7
          - name: paused
            enabled: false
            cron: "0 4 * * 0"
  components:
    master:
      type: seaweedfs
      replicas: 1
    volume:
      type: seaweedfs
      replicas: 1
      storage:
        size: 1Gi
    filer:
      type: seaweedfs
      replicas: 1
      storage:
        size: 1Gi
    s3:
      type: seaweedfs
      replicas: 1
