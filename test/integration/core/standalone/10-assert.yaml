apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-seaweedfs
  labels:
    core.openeverest.io/provider: provider-seaweedfs
status:
  # Nothing reports component replicas until the operator acts.
  phase: Initializing
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: test-seaweedfs
  (ownerReferences[?kind == 'Instance' && name == 'test-seaweedfs'] | length(@)): 1
spec:
  image: chrislusf/seaweedfs:4.47
  volumeServerDiskCount: 2
  master:
    replicas: 3
    volumeSizeLimitMB: 512
    defaultReplication: "001"
    labels:
      core.openeverest.io/component: master
      core.openeverest.io/instance: test-seaweedfs
      core.openeverest.io/provider: provider-seaweedfs
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  core.openeverest.io/component: master
                  core.openeverest.io/instance: test-seaweedfs
                  core.openeverest.io/provider: provider-seaweedfs
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
    persistence:
      enabled: true
      resources:
        requests:
          storage: 1Gi
  volume:
    replicas: 2
    maxVolumeCounts: 16
    labels:
      core.openeverest.io/component: volume
      core.openeverest.io/instance: test-seaweedfs
      core.openeverest.io/provider: provider-seaweedfs
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  core.openeverest.io/component: volume
                  core.openeverest.io/instance: test-seaweedfs
                  core.openeverest.io/provider: provider-seaweedfs
    storageClassName: local-path
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
      storage: 10Gi
  filer:
    replicas: 1
    maxMB: 8
    labels:
      core.openeverest.io/component: filer
      core.openeverest.io/instance: test-seaweedfs
      core.openeverest.io/provider: provider-seaweedfs
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  core.openeverest.io/component: filer
                  core.openeverest.io/instance: test-seaweedfs
                  core.openeverest.io/provider: provider-seaweedfs
    persistence:
      enabled: true
      resources:
        requests:
          storage: 2Gi
  s3:
    replicas: 1
    port: 8333
    domainName: s3.example.com
    labels:
      core.openeverest.io/component: s3
      core.openeverest.io/instance: test-seaweedfs
      core.openeverest.io/provider: provider-seaweedfs
    (affinity == null): true
    # Default ClusterIP leaves the operator's own Service defaults in place.
    (service == null): true
    configSecret:
      name: test-seaweedfs-s3-config
      key: s3.json
    (length(annotations."seaweedfs.openeverest.io/s3-config-checksum")): 64
  # Admin UI stays off unless topology.parameters.admin.enabled is true.
  (admin == null): true
---
apiVersion: v1
kind: Secret
metadata:
  name: test-seaweedfs-s3-config
  (ownerReferences[?kind == 'Instance' && name == 'test-seaweedfs'] | length(@)): 1
type: Opaque
data:
  (length(base64_decode(AWS_ACCESS_KEY_ID))): 20
  (length(base64_decode(AWS_SECRET_ACCESS_KEY))): 40
  (json_parse(base64_decode("s3.json")).identities[0].name): admin
  (json_parse(base64_decode("s3.json")).identities[0].credentials[0].accessKey == base64_decode(AWS_ACCESS_KEY_ID)): true
  (json_parse(base64_decode("s3.json")).identities[0].credentials[0].secretKey == base64_decode(AWS_SECRET_ACCESS_KEY)): true
