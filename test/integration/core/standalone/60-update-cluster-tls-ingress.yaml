apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-seaweedfs
spec:
  parameters:
    tls:
      # The operator creates its own self-signed issuer: an issuer here would
      # also sign S3 and change its certificate source, which is create-only.
      internalTLS: true
  components:
    s3:
      parameters:
        ingress:
          enabled: true
          host: s3.example.com
          className: nginx
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
          tls:
            secretName: test-seaweedfs-s3-tls
