apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-seaweedfs
status:
  phase: Ready
---
apiVersion: v1
kind: Secret
metadata:
  name: test-seaweedfs-conn
data:
  # The fake Service still has only s3-https, so the in-cluster endpoint stays HTTPS.
  (base64_decode(endpointURL) == join('', ['https://test-seaweedfs-s3.', $namespace, '.svc:8334'])): true
  (base64_decode(verifyTLS)): "false"
  (base64_decode(externalEndpointURL)): https://s3.example.com
  (base64_decode(externalVerifyTLS)): "true"
