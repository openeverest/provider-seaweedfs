# Each Instance below breaks exactly one provider validation rule.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: invalid-even-master-replicas
spec:
  providerRef:
    name: provider-seaweedfs
  components:
    master:
      type: seaweedfs
      replicas: 2
    volume:
      type: seaweedfs
      replicas: 1
      storage:
        size: 1Gi
    filer:
      type: seaweedfs
      replicas: 1
      storage:
        size: 1Gi
    s3:
      type: seaweedfs
      replicas: 1
---
