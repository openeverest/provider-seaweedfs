# The StorageClass is read from the cluster, so admission only warns about it:
# it may be created after the Instance.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: invalid-storage-class
spec:
  providerRef:
    name: provider-seaweedfs
  components:
    master:
      type: seaweedfs
      replicas: 1
    volume:
      type: seaweedfs
      replicas: 1
      storage:
        size: 1Gi
        storageClass: missing-storage-class
    filer:
      type: seaweedfs
      replicas: 1
      storage:
        size: 1Gi
    s3:
      type: seaweedfs
      replicas: 1
