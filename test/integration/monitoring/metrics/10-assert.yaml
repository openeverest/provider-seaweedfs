# Every Instance component serves metrics on the same port, whatever the
# deprecated metrics parameter says. The admin server is not an Instance
# component and serves none. seaweedfs-operator's own ServiceMonitors are off.
apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: metrics-seaweedfs
spec:
  serviceMonitor:
    enabled: false
  master:
    metricsPort: 9327
  volume:
    metricsPort: 9327
  filer:
    metricsPort: 9327
  s3:
    metricsPort: 9327
  admin:
    (metricsPort == null): true
---
# Nothing is serving yet, so nothing is published.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: metrics-seaweedfs
status:
  (monitoring.sources.metrics == null): true
