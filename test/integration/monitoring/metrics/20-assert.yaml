# One endpoint per Instance component with a ready pod, on its named port.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: metrics-seaweedfs
status:
  monitoring:
    sources:
      metrics:
        - component: master
          kind: seaweedfs
          podSelector:
            core.openeverest.io/instance: metrics-seaweedfs
            core.openeverest.io/component: master
          port: master-metrics
          path: /metrics
          scheme: http
        - component: volume
          kind: seaweedfs
          port: volume-metrics
        - component: filer
          kind: seaweedfs
          port: filer-metrics
        - component: s3
          kind: seaweedfs
          port: s3-metrics
