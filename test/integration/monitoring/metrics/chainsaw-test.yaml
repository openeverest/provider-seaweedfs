---
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: monitoring-metrics
spec:
  description: |
    The monitoring contract: every component serves metrics, and the provider
    publishes one endpoint per component in status.monitoring.sources once
    its pods are ready, for monitoring extensions to scrape. The deprecated
    spec.topology.parameters.metrics is accepted with a warning and ignored,
    and the scrape objects earlier releases created are deleted.
  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,seaweed,podmonitor,vmpodscrape -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-seaweedfs
        tail: 100
  steps:
    # The CRDs hold the scrape objects of an earlier release. CRDs a cluster
    # already has are left alone, so the suite does not downgrade an
    # installed operator.
    - name: setup
      try:
        - script:
            timeout: 120s
            content: |
              set -e
              kubectl get crd podmonitors.monitoring.coreos.com >/dev/null 2>&1 || \
                kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.93.1/example/prometheus-operator-crd/monitoring.coreos.com_podmonitors.yaml
              kubectl get crd vmpodscrapes.operator.victoriametrics.com >/dev/null 2>&1 || \
                kubectl apply --server-side -f https://raw.githubusercontent.com/VictoriaMetrics/operator/v0.75.1/config/crd/overlay/crd.descriptionless.yaml
              kubectl wait --for=condition=Established --timeout=60s crd/podmonitors.monitoring.coreos.com crd/vmpodscrapes.operator.victoriametrics.com
        - assert:
            file: 00-assert.yaml
        - apply:
            file: 05-legacy-scrapes.yaml

    - name: serve-metrics-and-delete-legacy-scrapes
      try:
        - script:
            content: kubectl apply -n $NAMESPACE -f 10-create-cluster.yaml
            check:
              ($error == null): true
              (contains($stderr, 'spec.topology.parameters.metrics: deprecated and ignored')): true
        - assert:
            file: 10-assert.yaml
        - error:
            file: 10-errors.yaml

    - name: publish-sources
      try:
        - script:
            content: |
              kubectl patch seaweed/metrics-seaweedfs --subresource status -n $NAMESPACE --type=merge -p '{"status":{
                "master":{"replicas":1,"readyReplicas":1},
                "volume":{"replicas":1,"readyReplicas":1},
                "filer":{"replicas":1,"readyReplicas":1},
                "s3":{"replicas":1,"readyReplicas":1}}}'
        - assert:
            file: 20-assert.yaml

    - name: delete-cluster
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: metrics-seaweedfs
        - wait:
            apiVersion: seaweed.seaweedfs.com/v1
            kind: Seaweed
            name: metrics-seaweedfs
            for:
              deletion: {}
